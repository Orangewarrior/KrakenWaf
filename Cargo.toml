
[package]
name = "krakenwaf"
version = "2.34.0"
edition = "2021"
authors = ["Orangewarrior"]
description = "TLS-aware Rust WAF inspired by OctopusWAF"
license = "MIT"

[features]
default = []
vectorscan-engine = ["dep:vectorscan"]

[dependencies]
ahash = "0.8"
arc-swap = "1.7"
dashmap = "6"
bincode = "1.3"
memchr = "2.7"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
aho-corasick = "1.1"
ammonia = "4.0"
anyhow = "1.0"
bytes = "1.7"
crypto-common = "0.1.7"
generic-array = "1.3.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.0"
brotli = "7.0"
zstd = { version = "0.13", default-features = false }
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1.9", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "webpki-tokio"] }
ipnet = "2.10"
once_cell = "1.19"
percent-encoding = "2.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "json"] }
fred = { version = "10.1", default-features = false, features = ["enable-rustls-ring", "i-scripts"] }
rustls = "0.23"
rustls-pki-types = { version = "1", features = ["std"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros", "io-util", "fs", "process"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
url = "2.5"
humantime = "2.1"
maxminddb = "0.27"
tar = "0.4"
webpki-roots = "1.0"
vectorscan = { package = "vectorscan-rs", version = "0.0.6", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.13"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.52", features = ["full"] }
which = "7"

[build-dependencies]
cc = "1.2"

[lints.clippy]
pedantic = "warn"
# Truncation from u32/usize is intentional and guarded where it appears.
cast_possible_truncation = "warn"
# `unwrap()` in production code is a latent panic; tests may keep it.
unwrap_used = "warn"
