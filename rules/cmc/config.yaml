global-options:
  # Paranoia level (0–100). Controls 2-signal block + 1-signal log thresholds
  # for java_deserialize_detect, the response-block gate for detect_db_errors
  # and detect_bad_artifacts (≥ 60 blocks), and the silent_sql_errors gate
  # (≥ 80 blocks, < 80 scrubs).
  # Default: 60
  Untrust: 60

  # Detection-engine block threshold (score). Rules with `score >= threshold`
  # block on their own; lower-scored rules accumulate inside a single
  # inspection view until their sum reaches `threshold`. See
  # docs/score_rank.md.
  # Overridden by --anomaly-threshold when present.
  # Default: 600
  Anomaly_threshold: 600

  # Per-request wall-clock cap on WAF inspection (milliseconds). When > 0
  # and the deadline elapses, inspection stops scanning additional views and
  # the request proceeds with whatever findings were produced so far.
  # 0 disables the deadline.
  # Overridden by --max-inspection-ms when present.
  # Default: 0 (disabled)
  Max_inspection_ms: 0

CMC-Rules:
  SQLi_comments_detect: true
  Overflow_detect: true
  SSTI_detect: true
  SSI_injection_detect: true
  ESI_injection_detect: true
  CRLF_injection_detect: true
  Request_Smuggling_detect: true
  NOSQL_injection_detect: true
  XXE_attack_detect: true
  Anti_exposed_backup: true
  Anti_passwd_leak: true
  Java_deserialize_detect: true
  Detect_db_errors: true
  Silent_sql_errors: true
  Detect_bad_artifacts: true
  Detect_bots_n_scanners: true
  HPP_detect: true
  Open_redirect_n_RFI_detect: true

# ─────────────────────────────────────────────────────────────────────────────
# Open Redirect / RFI multi-language hot parameters
#
# The Open_redirect_n_RFI_detect module always inspects the English hot-parameter
# list (redirect, url, next, file, include, …). To additionally inspect localized
# parameter names, set `multiple-languages-params: true` and turn on the specific
# language lists you need below. By default every language is disabled (0/false);
# customise this to your application's audience.
#
# Both `arabic_modern` and `arabic_modern_standard` map to the same Arabic Modern
# Standard list.
# ─────────────────────────────────────────────────────────────────────────────
multiple-languages-params: false
custom-languages-params:
  russian: false
  japanese: false
  german: false
  bengali: false
  indonesian: false
  french: false
  arabic_modern: false
  arabic_modern_standard: false
  spanish: false
  chinese_mandarin: false
  chinese: false
  hindi: false
  portuguese: false

# ─────────────────────────────────────────────────────────────────────────────
# Memory-pressure limits (2.29.0)
#
# These knobs cap every place where KrakenWaf buffers untrusted bytes. The
# defaults shipped here are deliberately conservative (≤ 8–16 MiB) so a fresh
# install cannot be turned into a memory-exhaustion DoS by a single attacker.
#
# Raise individual values when your workload legitimately needs larger
# payloads (file uploads, large JSON ingest, etc). The CLI flags
#   --max-body-bytes, --max-upstream-response-bytes, --max-connections
# override the YAML when set; otherwise the values below are used.
#
# When --max-connections is omitted KrakenWaf derives a value from total
# system RAM at startup (≈ 1 connection per 2 MiB, clamped to [64, 4096]).
#
# Note: the inflight-byte ceilings below (`*_inflight_*`) duplicate the
# `max_inflight_body_bytes` / `max_per_ip_body_bytes` knobs in
# `conf/ratelimit.yaml`. The ratelimit.yaml values take precedence at
# runtime; the keys here exist for self-contained operator templates.
# ─────────────────────────────────────────────────────────────────────────────

memory-limits:
  # Maximum request body the WAF will buffer + decompress + inspect (bytes).
  # 2.29.0 default: 8 MiB (was 100 MiB).
  max_request_body_buffered_bytes: 8388608

  # Maximum upstream response body the WAF will buffer (bytes).
  # 2.29.0 default: 8 MiB (was 100 MiB).
  max_response_body_buffered_bytes: 8388608

  # Streaming inspection window size (bytes). The buffered-and-inspect-once
  # body pipeline uses this only as the upper bound of pattern overlap.
  max_streaming_inspection_window_bytes: 262144

  # Aggregate ceiling on in-flight body buffering across ALL connections.
  # New requests beyond this point are rejected with 503 until pressure
  # subsides. Defends against a herd of slow uploads.
  max_inflight_body_bytes_global: 268435456

  # Per-IP ceiling on in-flight body buffering. A single source cannot
  # monopolise the global pool by opening many connections.
  max_inflight_body_bytes_per_ip: 16777216

  # Maximum decompressed / compressed expansion ratio (zip-bomb guard).
  # A POST whose Content-Encoding decompresses past this factor is rejected
  # before the inspection budget is exhausted.
  max_decompress_ratio: 32

  # max_connections (optional): pin the TCP accept cap. Comment out to let
  # KrakenWaf derive it from system RAM at startup.
  # max_connections: 1024
