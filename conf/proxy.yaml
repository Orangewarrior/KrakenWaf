# KrakenWaf — Proxy Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Load with:  --external-proxy-conf conf/proxy.yaml
#
# This file mirrors the proxy-related CLI flags so a deployment can keep the
# command line terse and version-control its proxy topology. Resolution order
# (highest precedence first):
#   1. An explicitly-passed CLI flag (e.g. --upstream ...)
#   2. The value below, when non-empty
#   3. The WAF's built-in default
#
# Parsing rules:
#   • One `key: value` per line; the value may contain colons (e.g. a URL).
#   • A `#` at the start of a line, or preceded by a space, starts a comment —
#     everything after it on the line is ignored.
#   • An empty value means "leave the WAF default in place" — it never overrides
#     anything. An empty `internal-header-name`, for instance, keeps the
#     internal header disabled; an empty `upstream-timeout-secs` keeps the
#     built-in 15 s default.

listen : 127.0.0.1:443
upstream : https://127.0.0.1:8080 # host defined by the user
upstream-timeout-secs: # when empty, defaults to a value defined by the WAF
upstream-ca: # empty -> trusts only public CAs; PEM path to trust a private upstream CA
allow-private-upstream: false # disabled
internal-header-name: # empty: disabled by default
real-ip-header: X-Forwarded-For
trusted-proxy-cidrs: 127.0.0.1/32
sni-map: ./rules/tls/sni_map.csv # default
no-tls: false # no-tls disabled by default
header-protection-injection: ./rules/headers_http/relax.headers
blockmsg: ./alert/blockalert.html # if left empty, no page is used
# Dedicated observability port (/metrics, /livez, /readyz, health). Binds the
# same IP as `listen`, on a separate port, reusing the same TLS certs as the
# listener (plain HTTP only when the WAF runs with --no-tls). Lets you isolate
# and route Prometheus scraping independently from proxied traffic. When
# --metrics-port is not passed on the command line, the WAF opens this file and
# uses the port below (default 4343).
#
# This port is protected by two independent gates: an IP allowlist
# (rules/addr/allowlist/allow_addrs_metrics_n_ui.txt, scoped via the `port:`
# field in rules/allowpaths/lists.yaml) and an `Authorization: Bearer <token>`
# credential. The token is NOT configured here — it is read from the
# KRAKENWAF_METRICS_TOKEN secret/env var (never hard-coded). See
# docs/observability.md.
metrics-port: 4343
