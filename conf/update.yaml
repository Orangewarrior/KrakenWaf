KrakenWaf:
  cron: "0 18 */15 * *"
blocklist:
  title: "Blocklist site"
  lists:
    url_file:
      - "https://lists.blocklist.de/lists/bruteforcelogin.txt"
      - "https://lists.blocklist.de/lists/bots.txt"
  cron: "0 12 */3 * *"
spamhaus:
  title: "Spamhaus site"
  lists:
    url_file: "https://www.spamhaus.org/drop/drop.lasso"
  DQS-key: false
  zones:
    - sbl
    - xbl
    - authbl
  cron: "0 12 */3 * *"
firehol:
  title: "Firehol"
  lists:
    url_file:
      - "https://iplists.firehol.org/files/firehol_proxies.netset"
      - "https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/c2_tracker.ipset"
  cron: "0 12 */3 * *"
maxmind-geo:
  title: "Maxmind GeoLite2 city"
  active: true
  # Credentials are loaded file-first, then from env vars — never hardcode them here.
  #   File (preferred): /run/secrets/krakenwaf/MAXMIND_ACCOUNT_ID and
  #                     /run/secrets/krakenwaf/MAXMIND_LICENSE_KEY (or *_FILE override)
  #   Env (fallback):   export MAXMIND_ACCOUNT_ID='your_account_id'
  #                     export MAXMIND_LICENSE_KEY='your_license_key'
  # See docs/secrets.md. Register at https://www.maxmind.com/en/ for free credentials.
  url_file:
    - "https://download.maxmind.com/geoip/databases/GeoLite2-City/download?suffix=tar.gz"
  # Update on the 1st of each month at 18:00 (MaxMind releases monthly updates).
  cron: "0 18 1 * *"
