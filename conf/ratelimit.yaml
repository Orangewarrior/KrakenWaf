# KrakenWaf — Rate-Limit Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Loaded automatically at startup. Use --ratelimit-by-file-conf <path> to
# select an alternative file.
#
# Priority chain for rate_limit_per_minute:
#   1. --rate-limit-per-minute CLI flag  (highest)
#   2. rate_limit_per_minute in this file
#   3. Built-in default: 240 req/min

# Maximum requests per minute per source IP.
# Set to 0 to defer to --rate-limit-per-minute or the built-in default (240).
rate_limit_per_minute: 240

# Maximum simultaneous in-flight connections accepted from a single IP.
# Excess connections receive HTTP 429 with Retry-After: 5.
# Set to 0 to disable per-IP concurrency limiting.
max_coroutines_per_ip: 64

# Slowloris protection: per-frame timeout (seconds) when streaming the
# request body. If the WAF waits longer than this for a single body chunk
# it returns 408 and drops the connection.
# Must be >= 1. `0` is rejected at startup because this guard is required.
# Overridden by --body-frame-timeout-secs when present.
# Default: 30
body_frame_timeout_secs: 30

# Anti-Slowloris (TLS accept path): maximum wall-clock time (seconds) the WAF
# waits for a client to complete the TLS handshake before dropping the
# connection. A client that opens a socket but never finishes the handshake
# would otherwise pin a connection slot (and a --max-connections permit)
# indefinitely — a handful of half-open sockets could exhaust capacity.
# Only applies to TLS mode (ignored under --no-tls).
# Set to 0 to disable the bound (NOT recommended — removes the anti-DoS guard).
# Overridden by --tls-handshake-timeout-secs when present.
# Default: 10 (a safe, conservative anti-DoS value)
tls_handshake_timeout_secs: 10

# Anti-Slowloris (HTTP/1 header phase): maximum time (seconds) to receive the
# complete request line and headers. This runs before request-level rate limits,
# so incomplete headers cannot pin a connection slot indefinitely.
# HTTP/2 is unaffected. Set to 0 to disable (NOT recommended).
# Overridden by --http-header-read-timeout-secs.
# Default: 10
http_header_read_timeout_secs: 10

# Global memory-backpressure cap (bytes) on in-flight request body data
# summed across all clients. When exceeded, new requests receive HTTP 503
# with Retry-After: 5.
# Set to 0 to disable the global cap.
# Overridden by --max-inflight-body-bytes when present.
# Default: 1073741824 (1 GiB)
max_inflight_body_bytes: 1073741824

# Per-IP memory-backpressure cap (bytes) on in-flight request body data.
# Prevents a single source IP from saturating the global body buffer.
# Set to 0 to disable the per-IP cap.
# Overridden by --max-per-ip-body-bytes when present.
# Default: 209715200 (200 MiB)
max_per_ip_body_bytes: 209715200

# ── Connection & body-size limits ─────────────────────────────────────────────
# These four knobs mirror the matching CLI flags. When --max-connections,
# --connection-timeout-secs, --max-body-bytes, or --max-upstream-response-bytes
# is omitted, the value here is loaded into the limiting context. Resolution
# order (highest first): CLI flag → this file → conf/filter.yaml
# memory-limits → built-in default.

# Maximum simultaneous TCP connections the WAF accepts.
# 0 (default) = derive a conservative cap from system RAM at startup, honouring
#               conf/filter.yaml :: memory-limits.max_connections if set.
# Overridden by --max-connections when > 0.
max_connections: 0

# Timeout (seconds) for a single client connection accepted by the WAF.
# Overridden by --connection-timeout-secs when present. Must be >= 1.
# Default: 30
connection_timeout_secs: 30

# Maximum request body buffered for inspection (bytes).
# 0 (default) = use conf/filter.yaml :: memory-limits.max_request_body_buffered_bytes
#               (built-in default 8388608 = 8 MiB).
# Overridden by --max-body-bytes when > 0.
max_body_bytes: 0

# Hard ceiling on textual upstream responses buffered for complete inspection.
# Binary/media responses use the streaming limits in conf/filter.yaml.
# 0 (default) = use conf/filter.yaml :: memory-limits.max_response_body_buffered_bytes
#               (built-in default 8388608 = 8 MiB).
# Overridden by --max-upstream-response-bytes when > 0.
max_upstream_response_bytes: 0

# ── Redis distributed rate limiter ────────────────────────────────────────────
# When this section is present KrakenWaf replaces the local TAT store with a
# Redis-backed GCRA using Redis TIME, enabling identical rate semantics across
# multiple WAF instances without application-host clock skew.
#
# CIS Redis Benchmark requirements enforced by KrakenWaf:
#   • TLS mandatory — URL MUST use the rediss:// scheme (encrypted transport).
#   • Credentials are loaded file-first, then from env vars — never hardcode here.
#     File (preferred): /run/secrets/krakenwaf/REDIS_PASSWORD (or REDIS_PASSWORD_FILE),
#                       /run/secrets/krakenwaf/REDIS_USERNAME. See docs/secrets.md.
#     Env (fallback):   REDIS_PASSWORD — AUTH password; REDIS_USERNAME — ACL user.
#   • Fail mode (fail_open, default true) — on Redis unavailability a request is
#     allowed (fail-open) or denied with 429 (fail-closed). Either way a warning
#     and a Prometheus counter (krakenwaf_redis_rate_limit_failopen_total /
#     _failclosed_total) are emitted. The local GCRA limiter is NOT used as a
#     fallback; disable the redis section to fall back to local mode.
#
# Example — uncomment and adjust to enable:
#
# redis:
#   # Redis endpoint. rediss:// enables TLS (required).
#   url: "rediss://redis.internal:6380/0"
#
#   # Number of pooled connections. Tune to match expected request concurrency.
#   pool_size: 4
#
#   # Namespace prefix — isolates this WAF from other services sharing Redis.
#   key_prefix: "krakenwaf:rl"
#
#   # GCRA period. Must be 60 because rate_limit_per_minute has a fixed
#   # per-minute contract.
#   window_secs: 60
#
#   # Path to a custom CA certificate (PEM) for private PKI / mTLS deployments.
#   # Omit to use the system trust store.
#   # ca_cert_path: "/etc/ssl/private/redis-ca.pem"
#
#   # Behaviour when Redis is unreachable / a check times out.
#   #   true  (default) — fail-open: allow the request (favours availability).
#   #   false           — fail-closed: deny with HTTP 429 (favours the limit).
#   # Both modes emit a warning + Prometheus counter so an outage is observable.
#   fail_open: true
