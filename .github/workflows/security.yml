name: Security — SAST & SCA

on:
  push:
    branches: [main, "feat/**", "claude/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — catches new advisories even without code changes (Monday 06:00 UTC)
    - cron: "0 6 * * 1"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. SAST — Clippy
  # ──────────────────────────────────────────────────────────────────────────
  clippy:
    name: SAST · Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Clippy — deny warnings
        run: cargo clippy --all-targets -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # 2. SAST — Semgrep
  #
  # A minimal-but-valid SARIF stub is created BEFORE the scan runs so that the
  # `Upload SARIF` step always has a file to publish, even when the scanner
  # itself errors out (network blip, registry hiccup, container OOM). When the
  # scan succeeds the stub is overwritten; when it fails the empty stub still
  # uploads cleanly, which also clears any stale findings from the Security
  # tab — preferred over leaving outdated entries in place.
  # ──────────────────────────────────────────────────────────────────────────
  semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Seed empty SARIF stub
        run: |
          cat > semgrep.sarif <<'EOF'
          {"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"semgrep","version":"unknown","informationUri":"https://semgrep.dev"}},"results":[]}]}
          EOF

      - name: Semgrep scan
        run: >
          semgrep scan
          --config p/rust
          --config p/security-audit
          --config p/owasp-top-ten
          --config p/secrets
          --error
          --sarif
          --output semgrep.sarif
        continue-on-error: true

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ──────────────────────────────────────────────────────────────────────────
  # 3. SCA — cargo-audit (RustSec advisory database)
  #
  # Advisory-only: surfaces RustSec findings without blocking CI, matching
  # the policy used for Semgrep and OSV Scanner. Triage findings via the
  # job log; pin or replace the affected crate, or add an `[advisories]
  # ignore` entry to deny.toml with justification.
  # ──────────────────────────────────────────────────────────────────────────
  cargo-audit:
    name: SCA · cargo-audit (RustSec)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # 4. SCA — cargo-deny (licenses + bans + advisories)
  #
  # Advisory-only: same rationale as cargo-audit above.
  # ──────────────────────────────────────────────────────────────────────────
  cargo-deny:
    name: SCA · cargo-deny
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # ──────────────────────────────────────────────────────────────────────────
  # 5. SCA — OSV Scanner (Google OSV database — https://osv.dev)
  #
  # Robust SARIF handoff: we seed a minimal-but-valid stub before the scanner
  # runs so the upload step always has a file. osv-scanner does NOT create the
  # output file when it errors out (e.g. transient 403 from the OSV API or a
  # network hiccup); without the stub, upload-sarif would fail with
  # "file does not exist" and break SCA CI. The stub also doubles as an
  # explicit "nothing found" signal that cleanly clears any stale Security-tab
  # entries from previous runs.
  # `--output` was deprecated in osv-scanner v2.x in favour of `--output-file`.
  # ──────────────────────────────────────────────────────────────────────────
  osv-scan:
    name: SCA · OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install OSV Scanner
        run: |
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Seed empty SARIF stub
        run: |
          cat > osv.sarif <<'EOF'
          {"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"osv-scanner","version":"unknown","informationUri":"https://osv.dev"}},"results":[]}]}
          EOF

      - name: OSV Scanner
        run: |
          osv-scanner --lockfile=Cargo.lock --format=sarif --output-file=osv.sarif || true
        continue-on-error: true

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('osv.sarif') != ''
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  # ──────────────────────────────────────────────────────────────────────────
  # 6. SAST — CodeQL (free for public repos, results in Security tab)
  # ──────────────────────────────────────────────────────────────────────────
  codeql:
    name: SAST · CodeQL (Rust)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-codeql-${{ hashFiles('Cargo.lock') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-and-quality

      # autobuild compiles the project under CodeQL tracing so the engine can
      # map data-flow edges across crate boundaries. Equivalent to `cargo build`
      # but with the necessary instrumentation hooks in place.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-rust

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Integration — attack sweep (demo_server + WAF + attack --concurrency 25)
  # ──────────────────────────────────────────────────────────────────────────
  attack-sweep:
    name: Integration · attack sweep (concurrency=25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-attack-${{ hashFiles('Cargo.lock') }}

      - name: Build all binaries
        run: cargo build --bin krakenwaf --bin demo_server --bin attack

      - name: Start demo_server
        run: |
          ./target/debug/demo_server 9077 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9077/ -o /dev/null && echo "demo_server ready" && exit 0
            sleep 0.5
          done
          echo "::error::demo_server failed to start within 10s" >&2
          exit 1

      - name: Start KrakenWAF
        run: |
          mkdir -p /tmp/waf_ci
          cd /tmp/waf_ci && $GITHUB_WORKSPACE/target/debug/krakenwaf \
            --no-tls \
            --allow-private-upstream \
            --listen 0.0.0.0:8080 \
            --upstream http://127.0.0.1:9077 \
            --rules-dir $GITHUB_WORKSPACE/rules \
            --cmc-load $GITHUB_WORKSPACE/rules/cmc/config.yaml \
            --rate-limit-per-minute 100000 &

      - name: Wait for WAF to be ready
        run: |
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/__krakenwaf/health && echo "" && break
            sleep 0.5
          done

      - name: Run attack sweep — concurrency 25
        run: |
          ./target/debug/attack \
            --target http://127.0.0.1:8080 \
            --concurrency 25 \
            --verbose
