[advisories]
version = 2
ignore = [
    # bincode 1.x is "unmaintained" per RUSTSEC-2025-0141, but the upstream
    # team explicitly considers v1.3.3 a complete release with no security
    # issues — they ceased development after a harassment incident. We rely
    # on bincode for serde-compatible binary encoding and the alternative
    # crates (postcard, bitcode, rkyv) are not API-compatible drop-ins.
    # No safe upgrade exists; tracking for future migration.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is feature-complete, no CVE; tracking migration to postcard/bitcode" },

    # hickory-proto 0.25.x DNSSEC DoS pair. Both are only reachable through the
    # `soldier_update` Quad9 DNS-over-TLS resolver (download + Spamhaus DQS
    # hostname resolution) — never on the request-serving data plane — and only
    # when an upstream resolver returns a crafted response. The fix lives in the
    # 0.26 line, which is a breaking migration: hickory-resolver 0.26 removes
    # `ResolverConfig::quad9_tls()`, makes `name_server` private, drops the
    # `LookupIp` iterator, and splits code into `hickory-net`, so it cannot be a
    # drop-in bump of the updater's resolver. Tracking the 0.26 migration
    # separately rather than rushing a security-sensitive DNS rewrite.
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25 NSEC3 DoS; only in soldier_update DoT resolver, 0.26 fix is a breaking migration — tracked" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25 name-compression DoS; only in soldier_update DoT resolver, 0.26 fix is a breaking migration — tracked" },

    # proc-macro-error2 is unmaintained (RUSTSEC-2026-0173). It is a build-time
    # only proc-macro dependency pulled transitively via sea-orm-macros → sea-bae;
    # nothing ships in the runtime binary. No safe upgrade is available and the
    # fix depends on sea-orm dropping the dependency upstream. Tracking.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; build-time only via sea-orm-macros, no runtime exposure, no upgrade available — tracked" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
