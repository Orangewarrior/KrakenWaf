[advisories]
version = 2
ignore = [
    # hickory-proto 0.25.x DNSSEC DoS pair. Reached through the Quad9
    # DNS-over-TLS resolver in two places: `soldier_update` (list download +
    # Spamhaus DQS hostname resolution) and, when `--blocklist-ip` + DQS-key are
    # enabled, the per-request Spamhaus DQS reputation check. As of 2.45.0 the
    # data-plane DQS path is TTL-cached per (client IP, zone), so a crafted
    # resolver response can be triggered at most once per IP per TTL rather than
    # per request — bounding the exposure. Both advisories require an upstream
    # resolver (Quad9, operator-trusted) to return a crafted response. The fix
    # lives in the 0.26 line, which is a breaking migration: hickory-resolver
    # 0.26 removes `ResolverConfig::quad9_tls()`, makes `name_server` private,
    # drops the `LookupIp` iterator, and splits code into `hickory-net`, so it
    # cannot be a drop-in bump of the resolver. Tracking the 0.26 migration
    # separately rather than rushing a security-sensitive DNS rewrite.
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25 NSEC3 DoS; Quad9 DoT resolver only, data-plane DQS path TTL-cached since 2.45.0, 0.26 fix is a breaking migration — tracked" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25 name-compression DoS; Quad9 DoT resolver only, data-plane DQS path TTL-cached since 2.45.0, 0.26 fix is a breaking migration — tracked" },

    # proc-macro-error2 is unmaintained (RUSTSEC-2026-0173). It is a build-time
    # only proc-macro dependency pulled transitively via sea-orm-macros → sea-bae;
    # nothing ships in the runtime binary. No safe upgrade is available and the
    # fix depends on sea-orm dropping the dependency upstream. Tracking.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; build-time only via sea-orm-macros, no runtime exposure, no upgrade available — tracked" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
