apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
spec:
  replicas: 1
  selector:
    matchLabels: { app: dvwa }
  template:
    metadata:
      labels: { app: dvwa }
    spec:
      containers:
        - name: dvwa
          image: vulnerables/web-dvwa
          ports:
            - { name: http, containerPort: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa
spec:
  selector: { app: dvwa }
  ports:
    - { name: http, port: 80, targetPort: http }
